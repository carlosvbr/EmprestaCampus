
name: DAST - OWASP ZAP

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: DAST - EmprestaCampus
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test 
        run: |
          SECRET_KEY=$(openssl rand -hex 50)
          ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          POSTGRES_PASSWORD=$(openssl rand -hex 32)

          cat > backend/.env <<EOF
          SECRET_KEY=${SECRET_KEY}
          ENCRYPTION_KEY=${ENCRYPTION_KEY}
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=
          POSTGRES_DB=empresta_campus
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          SMTP_HOST=
          SMTP_PORT=587
          SMTP_USE_TLS=True
          SMTP_USER=
          SMTP_PASSWORD=
          DEFAULT_FROM_EMAIL=teste@localhost
          EOF

      - name: certificate TSL
        run: |
          mkdir -p nginx/certs

          openssl req -x509 -nodes \
            -newkey rsa:2048 \
            -days 1 \
            -keyout nginx/certs/localhost.key \
            -out nginx/certs/localhost.crt \
            -subj "/CN=localhost"

      - name: Construction aplication 
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dast.yml \
            up --build -d

      - name: Backend 
        run: |
          for i in $(seq 1 60); do
            if curl -kfsS \
              https://localhost/api/usuarios/entrar/ \
              -o /dev/null; then

              echo "Backend disponivel"
              exit 0
            fi

            echo "Aguardando backend..."
            sleep 5
          done

          echo "Backend nao ficou disponivel"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dast.yml \
            logs

          exit 1

      - name: OWASP ZAP Baseline Scan
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://localhost"
          rules_file_name: ".zap/rules.tsv"
          fail_action: false
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"

      - name: OWASP ZAP Full Scan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: "https://localhost"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
          fail_action: true
          allow_issue_writing: false
          artifact_name: "zap-full-report"

      - name: Logs aplication 
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dast.yml \
            logs --no-color

      - name: End test 
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dast.yml \
            down -v --remove-orphans
