<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmprestaCampus - Acesso ao Sistema</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f3f4f6; margin: 0; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-box h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-login:hover { background-color: #1d4ed8; }
        .messages { color: #dc2626; text-align: center; margin-bottom: 15px; font-weight: bold; background-color: #fee2e2; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Acesso ao Sistema</h2>
    
    <!-- Exibe mensagens de erro, como senha incorreta -->
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p style="margin: 0;">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Aponta para a view de sessão tradicional -->
    <form action="{% url 'login_web' %}" method="POST">
        {% csrf_token %}
        
        <div class="input-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required placeholder="Digite seu usuário">
        </div>
        
        <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required placeholder="Digite sua senha">
        </div>
        
        <button type="submit" class="btn-login">Entrar no EmprestaCampus</button>
    </form>
</div>

</body>
</html>
